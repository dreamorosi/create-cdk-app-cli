[package]
name = "create-cdk-app"
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["Andrea Amorosi <dreamorosi@gmail.com>"]
repository = "https://github.com/dreamorosi/create-cdk-app-cli"
homepage = "https://github.com/dreamorosi/create-cdk-app-cli"
description = "Create a new CDK project scaffold"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7.4"
spinoff = "0.8.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
