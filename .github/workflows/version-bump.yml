name: Bump version and cut release

# Bumps the version in Cargo.toml, commits, tags, and pushes.
# The tag push triggers the release workflow (release.yml).
#
# Requires a RELEASE_TOKEN repo secret (fine-grained PAT with
# Contents: read/write on this repo). The default GITHUB_TOKEN cannot
# be used because tags it pushes do not trigger other workflows.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump version
        run: |
          cargo set-version --bump "${{ inputs.bump }}"
          cargo update --workspace

      - name: Commit, tag, and push
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --follow-tags
          echo "Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
