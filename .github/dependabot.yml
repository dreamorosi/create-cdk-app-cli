version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: [ ]
    schedule:
      interval: monthly
    ignore:
      # The SHA pins for these actions are managed in dist-workspace.toml
      # under [dist.github-action-commits]. If Dependabot bumped them in
      # release.yml directly, the file would drift from what `dist generate`
      # produces and the release workflow's freshness check would fail.
      # To update them: edit the SHA in dist-workspace.toml, run
      # `dist generate`, update the pin in version-bump.yml (checkout),
      # and commit the results.
      - dependency-name: actions/checkout
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact

  - package-ecosystem: cargo
    directory: /
    labels: [ ]
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /templates
    labels: [ ]
    schedule:
      interval: monthly
    versioning-strategy: increase
    groups:
      aws-sdk:
        patterns:
        - "@aws-sdk/**"
        - "@smithy/**"
        - "aws-sdk-client-mock"
        - "aws-sdk-client-mock-jest"
      aws-cdk:
        patterns:
        - "@aws-cdk/**"
        - "aws-cdk-lib"
        - "aws-cdk"
      powertools:
        patterns:
        - "@aws-lambda-powertools/**"
